<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
  <title id="title">Agent 学习手帐插画</title>
  <desc id="desc">打开的笔记本、Agent 流程、便签、植物与照片组成的暖色手帐插画</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#786b56" flood-opacity=".12"/>
    </filter>
    <pattern id="paperDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".75" fill="#d7cdbb" opacity=".56"/>
    </pattern>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#d8cfbe" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="480" fill="none"/>

  <g transform="translate(34 70) rotate(-5 95 135)">
    <rect x="0" y="0" width="188" height="270" rx="5" fill="#f4eddd" stroke="#d5c8b4"/>
    <rect x="0" y="0" width="188" height="270" rx="5" fill="url(#grid)" opacity=".58"/>
    <path d="M39 204c12-51 32-94 59-129M53 171c-25-18-38-36-39-55M77 119c25-13 43-31 54-54" fill="none" stroke="#7d8d6e" stroke-width="3" stroke-linecap="round"/>
    <path d="M20 113c22-7 40-2 54 15-20 14-38 9-54-15Zm71-36c18-13 36-14 53-3-10 20-27 21-53 3Zm-46 84c18-11 36-10 52 4-12 18-29 17-52-4Z" fill="#aeb99e" opacity=".74"/>
    <text x="94" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7a705f">keep learning</text>
    <path d="M149 27c-4-18 0-28 13-31 10 10 10 20 0 31" fill="none" stroke="#8d877b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)" transform="translate(205 54)">
    <path d="M0 34Q0 0 35 0h250v338H32Q0 338 0 306Z" fill="#fffaf0" stroke="#cbbda7" stroke-width="2"/>
    <path d="M285 0h250q35 0 35 34v272q0 32-32 32H285Z" fill="#fffaf0" stroke="#cbbda7" stroke-width="2"/>
    <rect x="20" y="18" width="244" height="298" fill="url(#paperDots)" opacity=".34"/>
    <rect x="306" y="18" width="244" height="298" fill="url(#paperDots)" opacity=".34"/>
    <path d="M285 10v314" stroke="#d8cdbb" stroke-width="3"/>

    <text x="58" y="66" font-family="KaiTi, STKaiti, serif" font-size="27" fill="#5d584e">Agent Notes</text>
    <g font-family="Songti SC, STSong, serif" font-size="15" fill="#71695d">
      <text x="60" y="110">• 感知 → 思考 → 行动</text>
      <text x="60" y="146">• 工具使用</text>
      <text x="60" y="182">• 记忆与上下文</text>
      <text x="60" y="218">• 规划与协作</text>
      <text x="60" y="254">• 自我反思与改进</text>
    </g>

    <g fill="#fbf7ee" stroke="#718164" stroke-width="2">
      <rect x="380" y="72" width="74" height="38" rx="5"/>
      <rect x="360" y="160" width="72" height="38" rx="5"/>
      <rect x="462" y="160" width="82" height="38" rx="5"/>
      <rect x="401" y="238" width="88" height="42" rx="5"/>
    </g>
    <g fill="#5f6558" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">
      <text x="417" y="96">Tool</text>
      <text x="396" y="184">RAG</text>
      <text x="503" y="184">Memory</text>
      <text x="445" y="264">Agent</text>
    </g>
    <g fill="none" stroke="#7a886c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M417 110v29M417 139l-22 20M417 139l85 20M396 199l30 38M503 199l-30 38"/>
      <path d="M412 133l5 6 5-6M390 153l5 6 5-6M497 153l5 6 5-6"/>
    </g>
    <text x="342" y="314" font-family="KaiTi, STKaiti, serif" font-size="16" fill="#817766">先把基础打牢，再去构建复杂系统。</text>
    <path d="M520 292c-8-28 0-47 22-58M523 280c-19-9-32-8-41 3M536 259c15-10 28-12 39-6" fill="none" stroke="#7e8e6f" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M543 234c12-4 22-1 27 8-8 11-18 10-27-8Zm-61 49c12-7 23-6 31 1-6 11-16 11-31-1Zm54-24c12-7 23-7 32 1-7 11-17 10-32-1Z" fill="#aab69c"/>
  </g>

  <g transform="translate(720 64) rotate(6 80 70)">
    <rect x="0" y="0" width="152" height="128" rx="4" fill="#e7dbc2"/>
    <rect x="12" y="12" width="128" height="82" rx="3" fill="#dbe5e5" stroke="#c5b99f"/>
    <path d="M14 78l35-34 24 21 22-27 43 40" fill="#a7b79c" opacity=".78"/>
    <path d="M12 68l34-24 28 17 23-17 43 24v26H12Z" fill="#c4d0bd" opacity=".8"/>
    <circle cx="119" cy="31" r="13" fill="#f3e4b9"/>
    <rect x="39" y="-10" width="74" height="22" fill="#d8c49d" opacity=".62" transform="rotate(4 76 0)"/>
  </g>

  <g transform="translate(714 205) rotate(-2 80 95)">
    <rect width="158" height="190" rx="4" fill="#e7dfec" stroke="#d3c8d8"/>
    <rect x="32" y="-9" width="78" height="20" fill="#d7c59f" opacity=".55" transform="rotate(3 71 0)"/>
    <text x="22" y="45" font-family="KaiTi, STKaiti, serif" font-size="18" fill="#6d655e">Today</text>
    <g font-family="Songti SC, STSong, serif" font-size="14" fill="#746c63">
      <text x="24" y="84">☑ 学一点点</text>
      <text x="24" y="116">☑ 实践一点点</text>
      <text x="24" y="148">☑ 记录一点点</text>
    </g>
    <path d="M122 154c-4-25 1-43 17-54M124 143c-13-8-23-8-30-2M135 122c12-7 21-8 29-2" fill="none" stroke="#7f8f70" stroke-width="2" stroke-linecap="round"/>
  </g>

  <path d="M155 36c15-23 33-31 54-24M191 9l18 3-8 16" fill="none" stroke="#a69a87" stroke-width="2" stroke-linecap="round"/>
  <path d="M862 232c20 8 29 23 26 45M890 264l-2 13-14-2" fill="none" stroke="#a69a87" stroke-width="2" stroke-linecap="round"/>
</svg>
