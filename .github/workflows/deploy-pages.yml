name: Deploy blog to GitHub Pages

on:
  workflow_run:
    workflows: ["Merge signal"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source PR
        id: source
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Report deployment start
        if: steps.source.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⏳ Pages deployment started from the main branch context."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Report successful build
        if: steps.source.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.source.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✅ Astro build and Pages artifact upload succeeded."

    outputs:
      pr_number: ${{ steps.source.outputs.pr_number }}

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report deployment result
        if: always() && needs.build.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "🚀 Pages deploy outcome: $DEPLOY_OUTCOME · $PAGE_URL"

      - name: Fail if Pages deployment failed
        if: steps.deployment.outcome != 'success'
        run: exit 1
