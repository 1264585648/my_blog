name: Merge signal

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  signal:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Confirm merged PR
        run: |
          echo "Merged PR ${{ github.event.pull_request.number }} will trigger the Pages deployment workflow."

      - name: Report merge signal
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✅ Merge signal completed; Pages deployment is next."
