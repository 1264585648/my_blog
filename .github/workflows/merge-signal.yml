name: Merge signal

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  signal:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Confirm merged PR
        run: |
          echo "Merged PR ${{ github.event.pull_request.number }} will trigger the Pages deployment workflow."
